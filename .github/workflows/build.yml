name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Grant Permission
        # This command finds every gradlew file in the repo and makes it executable
        run: find . -name "gradlew" -exec chmod +x {} +

      - name: Build with Gradle
        # We target the specific directory where your mobile code sits
        run: ./gradlew assembleDebug
        working-directory: campvoice/campvoice-mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampVoice-MVP-APK
          # This path covers the nested structure shown in your images
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
