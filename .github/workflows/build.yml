name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Auto-Path)
        run: |
          # 1. Find where gradlew is located
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          
          echo "Found gradlew in: $GRADLEW_DIR"
          
          # 2. Grant permission
          chmod +x "$GRADLEW_PATH"
          
          # 3. Change to that directory and build
          cd "$GRADLEW_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampVoice-MVP-APK
          # Using a wildcard to find the APK wherever it was built
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
