name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        # This path must be exact: campvoice/campvoice-mobile/gradlew
        run: chmod +x campvoice/campvoice-mobile/gradlew

      - name: Build with Gradle
        # Running from the specific mobile subfolder
        run: ./gradlew assembleDebug
        working-directory: campvoice/campvoice-mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampVoice-MVP-APK
          # This must match your actual nesting in the repo
          path: campvoice/campvoice-mobile/app/build/outputs/apk/debug/app-debug.apk
