name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Fixed path to match your nested structure
        working-directory: ./campvoice/campvoice-mobile 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Disabling the automatic cache for this specific run 
          # to prevent it from failing if it can't find the files immediately
          # cache: 'gradle' 

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampVoice-MVP-APK
          # Path must also include the full nested structure
          path: campvoice/campvoice-mobile/app/build/outputs/apk/debug/app-debug.apk
