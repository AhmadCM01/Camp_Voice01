name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # This line tells GitHub to run commands inside your mobile folder
    defaults:
      run:
        working-directory: ./campvoice-mobile 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampVoice-MVP-APK
          # Path must match where the file ends up inside the mobile folder
          path: campvoice-mobile/app/build/outputs/apk/debug/app-debug.apk
